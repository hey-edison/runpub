services:
  edge:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RUNPUB_DOMAIN: ${RUNPUB_DOMAIN}
      RUNPUB_TOKENS_JSON: ${RUNPUB_TOKENS_JSON}
      RUNPUB_PUBLIC_SCHEME: ${RUNPUB_PUBLIC_SCHEME:-https}
      RUNPUB_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - edge
    environment:
      RUNPUB_DOMAIN: ${RUNPUB_DOMAIN}
      RUNPUB_TLS_CERT_FILE: ${RUNPUB_TLS_CERT_FILE:-/certs/wildcard.crt}
      RUNPUB_TLS_KEY_FILE: ${RUNPUB_TLS_KEY_FILE:-/certs/wildcard.key}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
