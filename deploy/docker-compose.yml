services:
  edge:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RUNPUBLIC_DOMAIN: ${RUNPUBLIC_DOMAIN}
      RUNPUBLIC_TOKENS_JSON: ${RUNPUBLIC_TOKENS_JSON}
      RUNPUBLIC_PUBLIC_SCHEME: ${RUNPUBLIC_PUBLIC_SCHEME:-https}
      RUNPUBLIC_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - edge
    environment:
      RUNPUBLIC_DOMAIN: ${RUNPUBLIC_DOMAIN}
      RUNPUBLIC_TLS_CERT_FILE: ${RUNPUBLIC_TLS_CERT_FILE:-/certs/wildcard.crt}
      RUNPUBLIC_TLS_KEY_FILE: ${RUNPUBLIC_TLS_KEY_FILE:-/certs/wildcard.key}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
