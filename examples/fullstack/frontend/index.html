<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RunPublic full-stack example</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 42rem; margin: 12vh auto; padding: 0 1.25rem; line-height: 1.55; }
      button { font: inherit; padding: .55rem .85rem; }
      pre { padding: 1rem; overflow: auto; background: color-mix(in srgb, CanvasText 8%, Canvas); }
    </style>
  </head>
  <body>
    <h1>RunPublic full-stack example</h1>
    <p>This page is served by the local frontend on port 5173.</p>
    <button id="check">Call the public backend</button>
    <pre id="result">Waiting…</pre>
    <script>
      const result = document.querySelector("#result");
      const backendHost = location.host.replace("-frontend-", "-backend-");
      const backendUrl = `${location.protocol}//${backendHost}/api/hello`;

      document.querySelector("#check").addEventListener("click", async () => {
        result.textContent = `GET ${backendUrl}`;
        try {
          const response = await fetch(backendUrl);
          result.textContent = JSON.stringify(await response.json(), null, 2);
        } catch (error) {
          result.textContent = String(error);
        }
      });
    </script>
  </body>
</html>
